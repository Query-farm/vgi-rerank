# Private graders for `vgi-lint simulate` (VGI416). The worker publishes only
# task names and prompts in vgi.agent_test_tasks; these canonical solutions and
# grading options stay in the repo and are merged by task name.
tasks:
  - name: list-supported-models
    reference_sql: "SELECT model, license FROM rerank.main.supported_models ORDER BY model"
    ignore_column_names: true
    unordered: true
  - name: default-model-license
    reference_sql: "SELECT license FROM rerank.main.supported_models WHERE model = 'Xenova/ms-marco-MiniLM-L-6-v2'"
    ignore_column_names: true
  - name: rerank-score-value
    reference_sql: "SELECT rerank.main.rerank_score('how do I reset my password', 'Click the forgot password link to reset it.')"
    ignore_column_names: true
